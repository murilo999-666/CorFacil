sentence=Sensor de cor TCS34725 facil: separa PRETO, BRANCO, VERDE e VERMELHO com um comando. Para turmas de robotica (OBR).
paragraph=Uso: sensor.iniciar(), sensor.lerCor() e sensor.calibrar(BRANCO). A calibracao fica salva na placa (EEPROM no Uno, NVS no ESP32). A borda da linha preta nao vira verde (o codigo separa brilho de cor) e a leitura nunca trava o programa. Sem biblioteca externa: so a Wire. Calibracao pelo Monitor Serial ou por um botao, varios sensores com TCA9548A ou com os dois I2C do ESP32.
category=Sensors
